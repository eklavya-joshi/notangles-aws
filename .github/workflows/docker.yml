name: Docker
on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  ENVIRONMENT: production
  IMAGE_NAME: notangles
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  build-client:
    name: 'Build (Client)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.GH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
          platforms: linux/amd64
          file: client/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
            GOOGLE_ANALYTICS_ID=${{ secrets.GOOGLE_ANALYTICS_ID }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            SENTRY_INGEST_CLIENT=${{ secrets.SENTRY_INGEST_CLIENT }}
            SENTRY_TRACE_RATE_CLIENT=${{ secrets.SENTRY_TRACE_RATE_CLIENT }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/notangles/client:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/notangles/client:latest

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [build-client]
    defaults:
      run:
        working-directory: terraform

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: eklavya-joshi/deployment
          token: ${{ secrets.GH_TOKEN }}
          ref: dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.GH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_github_repo_name: ${{ github.repository }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_github_repo_name: ${{ github.repository }}

  deploy:
    name: Deploy (ECS)
    runs-on: ubuntu-latest
    needs: [build-client, terraform]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
    concurrency: production
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: eklavya-joshi/deployment
          token: ${{ secrets.GH_TOKEN }}
          ref: dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.GH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download client task definition
        id: client-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/${{ env.ENVIRONMENT }}/client-task-definition.json
          container-name: notangles
          image: ${{ env.ECR_REGISTRY }}/notangles/client:${{ github.sha }}

      - name: Deploy client to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.client-task-def.outputs.task-definition }}
          service: notangles-client-service-new
          cluster: notangles-cluster-client
          wait-for-service-stability: true
