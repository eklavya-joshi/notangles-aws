name: Docker
on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  ENVIRONMENT: production
  IMAGE_NAME: notangles
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .tf

    permissions:
      id-token: write
      contents: read

    outputs:
      task_definition_family: ${{ steps.get-tf-output.outputs.task_definition_family }}
      client_task_definition_json: ${{ steps.get-tf-output.outputs.client_task_definition_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: eklavya-joshi/deployment
          token: ${{ secrets.GH_TOKEN }}
          ref: dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.GH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # - name: Terraform Destroy
      #   run: terraform destroy
      #   env:
      #     TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_github_repo_name: ${{ github.repository }}

      - name: Terraform Apply
        id: tf-apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_github_repo_name: ${{ github.repository }}
        
      - name: Get Terraform Output
        id: get-tf-output
        run: |
          TASK_DEF_family=$(terraform output -raw task_definition_family)
          echo "task_definition_family=$TASK_DEF_family" >> "$GITHUB_OUTPUT"

          CLIENT_TASK_DEF_JSON=$(terraform output -raw client_task_definition_json)
          echo "client_task_definition_json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CLIENT_TASK_DEF_JSON" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  deploy:
    name: Push (ECR) & Deploy (ECS)
    runs-on: ubuntu-latest
    needs: [terraform]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
    concurrency: production
    environment: production

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.push-docker-image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   repository: eklavya-joshi/deployment
        #   token: ${{ secrets.GH_TOKEN }}
        #   ref: dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.GH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (needed for push)
        uses: docker/setup-buildx-action@v3

      - name: Push Docker image to ECR
        id: push-docker-image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          platforms: linux/amd64
          file: client/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
            GOOGLE_ANALYTICS_ID=${{ secrets.GOOGLE_ANALYTICS_ID }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            SENTRY_INGEST_CLIENT=${{ secrets.SENTRY_INGEST_CLIENT }}
            SENTRY_TRACE_RATE_CLIENT=${{ secrets.SENTRY_TRACE_RATE_CLIENT }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/notangles/client:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/notangles/client:latest

      # - name: Create task-definition.json
      #   id: create-task-def-file
      #   run: |
      #     echo "${{ needs.terraform.outputs.client_task_definition_json }}" > task-definition.json
      #     echo "task_definition_file=task-definition.json" >> "$GITHUB_OUTPUT"

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition notangles-client-terraform \
          --query taskDefinition \
          --output json > taskDefinition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: update-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.1.3
        with:
          task-definition: taskDefinition.json
          container-name: ${{ secrets.AWS_ECS_CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/notangles/client:${{ github.sha }}

      - name: Deploy client to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.update-task-def.outputs.task-definition }}
          service: notangles-client-service-new
          cluster: notangles-cluster-client
          wait-for-service-stability: true
