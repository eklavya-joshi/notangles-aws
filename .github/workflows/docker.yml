name: Docker
on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  ENVIRONMENT: production
  IMAGE_NAME: notangles
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    permissions:
      id-token: write
      contents: read

    outputs:
      client_alb_dns_name: ${{ steps.get-tf-output.outputs.client_alb_dns_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   repository: eklavya-joshi/deployment
        #   token: ${{ secrets.GH_TOKEN }}
        #   ref: dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.GH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # - name: Terraform Destroy
      #   run: terraform destroy
      #   env:
      #     TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_github_repo_name: ${{ github.repository }}
          TF_VAR_alb_certificate: ${{ secrets.ALB_CERTIFICATE }}

      - name: Terraform Apply
        id: tf-apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_github_repo_name: ${{ github.repository }}
          TF_VAR_alb_certificate: ${{ secrets.ALB_CERTIFICATE }}
        
      - name: Get Terraform Output
        id: get-tf-output
        run: |
          CLIENT_ALB_DNS_NAME=$(terraform output -raw client_alb_dns_name)
          echo "client_alb_dns_name=$CLIENT_ALB_DNS_NAME" >> "$GITHUB_OUTPUT"

  deploy:
    name: Push (ECR) & Deploy (ECS)
    runs-on: ubuntu-latest
    needs: [terraform]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
    concurrency: production
    environment: production

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.push-docker-image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   repository: eklavya-joshi/deployment
        #   token: ${{ secrets.GH_TOKEN }}
        #   ref: dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.GH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (needed for push)
        uses: docker/setup-buildx-action@v3

      - name: Push Docker image to ECR
        id: push-docker-image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          platforms: linux/amd64
          file: client/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
            GOOGLE_ANALYTICS_ID=${{ secrets.GOOGLE_ANALYTICS_ID }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            SENTRY_INGEST_CLIENT=${{ secrets.SENTRY_INGEST_CLIENT }}
            SENTRY_TRACE_RATE_CLIENT=${{ secrets.SENTRY_TRACE_RATE_CLIENT }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/notangles/client:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/notangles/client:latest

      - name: Run Trivy vulnerability scan on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/notangles/client:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition notangles-client-terraform \
          --query taskDefinition \
          --output json > taskDefinition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: update-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.1.3
        with:
          task-definition: taskDefinition.json
          container-name: notangles
          image: ${{ env.ECR_REGISTRY }}/notangles/client:${{ github.sha }}

      - name: Deploy client to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.update-task-def.outputs.task-definition }}
          service: notangles-client-service-terraform
          cluster: notangles-cluster-client-terraform
          wait-for-service-stability: true

      - name: Create Cloudflare DNS Record
        uses: infraway/create-dns-record@v2.0
        with:
          type: "CNAME"
          name: "notangles.eklavya-joshi.com"
          content: ${{ needs.terraform.outputs.client_alb_dns_name }}
          ttl: 3600
          proxied: true
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          